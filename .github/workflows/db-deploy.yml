name: Database deploy

# main → keyfly-prod, staging → keyfly-staging
# Required GitHub secrets: SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD_PROD, SUPABASE_DB_PASSWORD_STAGING
on:
  push:
    branches: [main, staging]
    paths: ["supabase/migrations/**"]
  workflow_dispatch:

concurrency:
  group: db-deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ github.ref_name == 'main' && 'hieyofnjtrqnffzebxgg' || 'doriyqslvarvucbwlczq' }}
      SUPABASE_DB_PASSWORD: ${{ github.ref_name == 'main' && secrets.SUPABASE_DB_PASSWORD_PROD || secrets.SUPABASE_DB_PASSWORD_STAGING }}
    steps:
      - uses: actions/checkout@v4
      - name: Check secrets
        id: check
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::warning::Supabase secrets missing – skipping migrations. See README: Automatic migrations."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: supabase/setup-cli@v1
        if: steps.check.outputs.skip != 'true'
        with:
          version: 2.122.0
      - if: steps.check.outputs.skip != 'true'
        run: |
          supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          supabase db push --password "$SUPABASE_DB_PASSWORD"
